name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Claude Code (e2e runs `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: npm run test:e2e
      - name: dist/ matches a fresh build of src/
        run: git diff --exit-code -- dist/
